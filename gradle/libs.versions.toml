[versions]
# ---------- 工具链 ----------
# ⚠️ AGP 的上限 = 本机 Android Studio 支持的最高版本，**必须实测，不要照抄任何历史结论**。
#    取证方式：读 %LOCALAPPDATA%\Google\AndroidStudio<版本>\log\idea.log，
#    检索 "latest.known.compatible.agp.version="，取最近一条。
#    2026-10-08 从 MD3E 项目（本机 IDE 已更新）原样沿用：alpha07 可用。
agp = "9.5.0-alpha07"
kotlin = "2.4.21-RC"
ksp = "2.3.12"

# ---------- AndroidX（不含 Compose，Compose 走 BOM） ----------
coreKtx = "1.19.1"
activityCompose = "1.14.0-alpha03"
lifecycle = "2.12.0-alpha04"
navigation3 = "1.3.0-alpha02"
window = "1.6.0-alpha05"
datastore = "1.3.0-alpha11"

# ---------- Compose ----------
composeBomAlpha = "2026.10.00"
# ⚠️ material3-lint 用 lintChecks() 声明，而 lintChecks 是与 implementation 不同的 configuration，
# 不继承 implementation(platform(bom)) 的版本约束 —— 因此必须显式写版本（与 BOM 映射值保持一致）。
material3Lint = "1.5.0-beta01"

# ---------- 三方 ----------
# Shizuku：借 shell 身份执行命令（用于「点一下直接打开无障碍」，见 util/ShizukuShell.kt）
shizuku = "13.1.5"
serialization = "1.12.0-RC"
materialSymbols = "2.2.1"

# ---------- 测试 ----------
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

[libraries]
# Compose BOM：ui / foundation / runtime / animation / material3 / material3.adaptive 全部交给它
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom-alpha", version.ref = "composeBomAlpha" }

# ---- Compose（不写版本，由 BOM 管理）----
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
androidx-compose-foundation-layout = { group = "androidx.compose.foundation", name = "foundation-layout" }
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-animation = { group = "androidx.compose.animation", name = "animation" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-navigation-suite = { group = "androidx.compose.material3", name = "material3-adaptive-navigation-suite" }
androidx-compose-material3-lint = { group = "androidx.compose.material3", name = "material3-lint", version.ref = "material3Lint" }
androidx-compose-material3-adaptive = { group = "androidx.compose.material3.adaptive", name = "adaptive" }
androidx-compose-material3-adaptive-layout = { group = "androidx.compose.material3.adaptive", name = "adaptive-layout" }
# ⚠️ Navigable*PaneScaffold / AnimatedPane / remember*PaneScaffoldNavigator 都在这个 artifact 里，
# **不在** adaptive-layout。要用"带导航与预测性返回的窗格脚手架"必须显式引入它。
androidx-compose-material3-adaptive-navigation = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation" }
androidx-compose-material3-adaptive-navigation3 = { group = "androidx.compose.material3.adaptive", name = "adaptive-navigation3" }

# ---- AndroidX（不在 BOM 内，必须显式版本）----
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-window = { group = "androidx.window", name = "window", version.ref = "window" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# ---- 三方 ----
kotlinx-serialization-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-core", version.ref = "serialization" }
icons-symbols-rounded = { group = "com.composables", name = "icons-material-symbols-rounded-cmp", version.ref = "materialSymbols" }
# ⚠️ `provider` 是必须的：Shizuku 靠它把 binder 递进来（清单里要声明 ShizukuProvider，见 AndroidManifest）
shizuku-api = { group = "dev.rikka.shizuku", name = "api", version.ref = "shizuku" }
shizuku-provider = { group = "dev.rikka.shizuku", name = "provider", version.ref = "shizuku" }
icons-symbols-rounded-filled = { group = "com.composables", name = "icons-material-symbols-rounded-filled-cmp", version.ref = "materialSymbols" }

# ---- 测试 ----
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# ⚠️ 这里**故意没有** com.android.library 的别名。若将来新增本地 library 模块
#    （如内嵌 miuix 源码），它应当写无版本的 `id("com.android.library")` ——
#    AGP 已被 :app 带进整个 build 的 plugin classpath，再声明一次版本会报
#    "already on the classpath with an unknown version"。
#    当前 project 只有 :app 一个模块（见 settings.gradle.kts）。
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
